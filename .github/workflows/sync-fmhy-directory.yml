name: Sync FMHY streaming directory

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmhy-directory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync official FMHY wiki metadata
        run: node scripts/sync-fmhy-directory.mjs
      - name: Commit directory changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fmhy-streaming-directory.json
          if git diff --cached --quiet; then
            echo "FMHY directory has no changes."
            exit 0
          fi
          git commit -m "chore: sync FMHY streaming directory"
          git push
